name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check every local link resolves
        run: python3 tools/check_links.py

      # The passcode comes from the SITE_PASSCODE repository secret, so it is
      # never committed. Without it the build stops rather than publishing an
      # open site.
      - name: Stamp in the passcode
        env:
          SITE_PASSCODE: ${{ secrets.SITE_PASSCODE }}
        run: python3 tools/inject_passcode.py

      - name: Confirm the passcode actually landed
        run: python3 tools/inject_passcode.py --check

      # Pages has to be switched on once by hand, under
      # Settings -> Pages -> Source -> GitHub Actions. The workflow token is not
      # allowed to create the Pages site itself, so this step fails with
      # "Get Pages site failed" until that is done.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
